<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Page Not Found | Ikaai Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261106_v11">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-base, #0b0c10);
      color: var(--text-primary, #ffffff);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .not-found-card {
      width: 90%;
      max-width: 460px;
      padding: 40px 32px;
      text-align: center;
      background: var(--bg-surface, #14161d);
      border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.08));
      border-radius: var(--radius-lg, 16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .error-code {
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #00a544 0%, #10b981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .error-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .error-desc {
      font-size: 14px;
      color: var(--text-secondary, #94a3b8);
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .return-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-full, 9999px);
      background-color: var(--accent-primary, #00a544);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .return-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="not-found-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The requested curriculum resource or library page does not exist or has moved.</p>
    <a href="/index.html" class="return-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Return to Library Portal
    </a>
  </div>
</body>
</html>
